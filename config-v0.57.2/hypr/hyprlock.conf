source = ./colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $obsidian
}

label {
    monitor =
    text = $TIME
    color = $ivory
    font_family = JetBrains Mono
    font_size = 52
    position = 0, 144
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = $ash
    font_family = Inter
    font_size = 14
    position = 0, 92
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    rounding = 5
    outer_color = $lavender
    inner_color = $surface
    font_color = $ivory
    fail_color = $error
    fade_on_empty = false
    placeholder_text = Password
    position = 0, -12
    halign = center
    valign = center
}
