include colors.conf
font_family JetBrains Mono
font_size 10.5
initial_window_width 520
initial_window_height 150
remember_window_size no
placement_strategy center
hide_window_decorations no
wayland_titlebar_color #201D27
window_padding_width 8
background_opacity 0.90
enable_audio_bell no

# Let the global clipboard scripts call only Kitty's built-in copy/paste actions
# through a private per-process socket. Keep the socket in this user's runtime dir.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# The global Ctrl+Shift+C/V helpers synthesize Ctrl+C/V in every application.
# Preserve terminal interrupt behavior while enabling the same copy/paste keys.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
