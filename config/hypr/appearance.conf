general {
    layout = dwindle
    border_size = 2
    gaps_in = 6
    gaps_out = 12
    col.active_border = $lavender
    col.inactive_border = $deep_violet
}

decoration {
    rounding = 5
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = $shadow
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $obsidian
}
